name: Enterprise AP CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify n8n Single Source of Truth
        run: npm run build:n8n -- --check

      - name: Run Unit & Enterprise Regression Tests
        run: node --test

      - name: Run Deterministic E2E Benchmark (Mock)
        run: npm run benchmark:mock

      - name: Build Production CSS
        run: npm run build

      - name: Security Dependency Audit
        run: npm audit --omit=dev --audit-level=high
